<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<meta name="description" content="Send a note, a secret or a heart to someone's keepsake box.">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Send to the box</title>
<link rel="stylesheet" href="/css/base.css">
</head>
<body>

<div class="page page--send">
  <div class="wrongbox hidden" id="wrongbox">
    <h1>that box isn&#8217;t here</h1>
    <p>Check the code on the card that came with the box, and try again.</p>
    <button class="btn btn--primary" id="wrong-back">try again</button>
  </div>

  <div class="pair hidden" id="pair">
    <h1>which box?</h1>
    <p>Enter the code from the card that came with the box.</p>
    <input class="text" id="pair-code" maxlength="5" placeholder="CODE" autocomplete="off">
    <p class="err hidden" id="pair-err"></p>
    <button class="btn btn--primary" id="pair-go">open the box</button>
  </div>

  <div class="sendcard hidden" id="sendcard">
    <header class="sendcard__head">
      <div>
        <h1 id="sc-title">The Keepsake Box</h1>
        <div class="code">code <b id="sc-code"></b></div>
      </div>
      <div class="presence" id="sc-presence"><i></i><span>connecting&hellip;</span></div>
    </header>

    <label class="field">your note
      <textarea class="msg" id="note-text" maxlength="900" placeholder="Write like you&#8217;d fold it into paper&#8230;"></textarea>
    </label>

    <label class="seal-toggle">
      <input type="checkbox" id="note-seal">
      <span class="track"></span>
      <span class="cap">seal it &#8212; they have to spin the heart to break the wax</span>
    </label>

    <label class="field">your name
      <input class="text" id="sender-name" maxlength="30" placeholder="how they know you">
    </label>

    <div class="sendcard__actions">
      <button class="btn btn--heart" id="btn-heart" title="send a heart" aria-label="send a heart">&#10084;</button>
      <button class="btn btn--primary sendbtn" id="send-btn" disabled>send</button>
    </div>
  </div>
</div>

<div class="spun" id="spun">they spun the heart back for you</div>
<div class="hearts-burst" id="burst"></div>

<script src="/js/sound.js"></script>
<script src="/js/heart.js"></script>
<script src="/js/sender.js"></script>
</body>
</html>
